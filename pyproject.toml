[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerlabs-gui"
version = "1.0.0"
description = "Cliente de escritorio PyQt6 para DockerLabs: catálogo, descargas directas y lanzador de CTFs con Docker"
requires-python = ">=3.10"
authors = [{ name = "Genspark AI" }]
dependencies = [
    "PyQt6>=6.5",
    "requests>=2.31",
]

[project.optional-dependencies]
notifications = [
    "winotify>=1.1; platform_system == 'Windows'",
    "plyer>=2.1",
]

[project.scripts]
dockerlabs-gui = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "theme",
    "notifier",
    "settings_store",
    "dockerlabs_api",
    "dockerlabs_api_ext",
    "dockerlabs_csv",
    "http_downloader",
    "download_manager",
    "lab_manager",
    "lab_controller",
    "app_logging",
    "catalog",
    "completed_store",
    "workers",
    "session_controller",
    "catalog_controller",
    "media_cache",
]
packages = ["widgets"]

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E701", "E702", "B008", "B904", "E402", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E701", "B"]
