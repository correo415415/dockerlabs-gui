name: CI

# Ejecución SOLO manual (Actions → CI → Run workflow) para no consumir minutos en cada push.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Sistemas a probar"
        type: choice
        default: all
        options: [all, ubuntu, windows, macos]

# Sin caché de Actions (no disponible en esta cuenta): cada job instala desde cero.
jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    if: ${{ inputs.os == 'all' || startsWith(matrix.os, inputs.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-image0
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest tests -q
